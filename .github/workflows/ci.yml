name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 (what action-setup@v6 installs) requires Node >= 22.13.
          # Keep this in sync with `release.yml`.
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Build first so dependent packages (cli, openclaw) can resolve
      # @alavida-ai/outlook-core's emitted d.ts during typecheck.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
